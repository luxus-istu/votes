name: Cross-Platform Release (Android & iOS)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > androidApp/release.keystore
          fi

      - name: Build Release APK and AAB
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --stacktrace

      - name: Prepare Android Artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          mkdir -p artifacts
          
          if [ -f "androidApp/build/outputs/apk/release/androidApp-release.apk" ]; then
            cp androidApp/build/outputs/apk/release/androidApp-release.apk "artifacts/Votes-${TAG_NAME}.apk"
          elif ls androidApp/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp androidApp/build/outputs/apk/release/*.apk "artifacts/Votes-${TAG_NAME}.apk"
          fi
          
          if [ -f "androidApp/build/outputs/bundle/release/androidApp-release.aab" ]; then
            cp androidApp/build/outputs/bundle/release/androidApp-release.aab "artifacts/Votes-${TAG_NAME}.aab"
          elif ls androidApp/build/outputs/bundle/release/*.aab 1> /dev/null 2>&1; then
            cp androidApp/build/outputs/bundle/release/*.aab "artifacts/Votes-${TAG_NAME}.aab"
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-files
          path: artifacts/*

  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    # TODO: Fix building steps
    if: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build iOS Archive
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath iosApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          mkdir -p artifacts
          mkdir -p Payload
          cp -r iosApp.xcarchive/Products/Applications/iosApp.app Payload/
          zip -r "artifacts/Votes-${TAG_NAME}-ios.ipa" Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-files
          path: artifacts/*

  publish-release:
    name: Publish GitHub Release
    # needs: [build-android, build-ios]
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
